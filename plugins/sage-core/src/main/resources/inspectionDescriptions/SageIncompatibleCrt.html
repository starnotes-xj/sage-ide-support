<p>Reports a four-argument <code>crt(a, b, m, n)</code> call when the literal congruences are incompatible: the residues disagree modulo <code>gcd(m, n)</code>.</p>
<p>Only integer literals with nonzero moduli are analyzed. Dynamic calls, list forms, and qualified calls are left to SageMath.</p>
