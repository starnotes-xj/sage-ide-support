name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      # CI=true makes build.gradle.kts download PyCharm Community 2026.1.4 as
      # the plugin SDK (the bundled Python plugin jars land on the compile
      # classpath automatically); locally the existing PyCharm install is used.
      - name: Build plugin
        run: gradle buildPlugin --no-daemon

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: sage-ide-support
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sage-ide-support
          path: dist

      - name: Attach plugin zip to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
