name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      # CI=true makes build.gradle.kts download PyCharm Community 2026.2.1 as
      # the plugin SDK (the bundled Python plugin jars land on the compile
      # classpath automatically); locally the existing PyCharm install is used.
      - name: Build plugin
        run: gradle buildPlugin --no-daemon

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: sage-ide-support
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      # Upload the same zip to the JetBrains Marketplace.  The token comes
      # from the PUBLISH_TOKEN repository secret (created on
      # plugins.jetbrains.com; it only updates plugins that already exist
      # there — the very first upload must be done once manually on the
      # website, see README).  continue-on-error keeps GitHub releases
      # working until that first manual upload has happened; flip the step
      # to strict once the plugin page is live.
      - name: Publish to JetBrains Marketplace
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: gradle publishPlugin --no-daemon

      - uses: actions/download-artifact@v4
        with:
          name: sage-ide-support
          path: dist

      - name: Attach plugin zip to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
